name: CI

# Pull requests are linted and tested; no packages are built for them.
# Packages are built only when a push to main carries a new version in
# Cargo.toml: both .debs are built, test-installed on Debian and Ubuntu, and
# attached to a draft release, to be checked and published by hand.
# Publishing the draft creates the tag. A manual run builds and
# test-installs the packages without releasing them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A draft release has no tag yet, so look for the release as well.
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null \
            || gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version already has a release."
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is a new version."
            echo "new=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # These run on release pull requests too, so mistakes show up before merging.
      - name: Check version goes up
        if: steps.version.outputs.new == 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "::error::Cargo.toml says $version, which is lower than the latest release v$latest."
            exit 1
          fi

      - name: Check changelog matches
        if: steps.version.outputs.new == 'true'
        run: |
          expected="retropie-rom-manager (${{ steps.version.outputs.version }}-1)"
          top=$(head -n1 packaging/changelog)
          case "$top" in
            "$expected "*) ;;
            *)
              echo "::error::packaging/changelog starts with \"$top\". Add an entry for $expected at the top."
              exit 1
              ;;
          esac

  check:
    name: Lint and test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    env:
      # rustc can overflow its stack compiling gpui-component.
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    name: Build (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's older glibc keeps the .deb installable on Debian 12 and up.
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # rustc can overflow its stack compiling gpui-component.
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Test
        run: cargo test --locked

      - name: Build .deb
        run: cargo deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error
          # The release job attaches them right away; keep them only long
          # enough to grab a manual build.
          retention-days: 3

  install:
    name: Install on ${{ matrix.image }} (${{ matrix.arch }})
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04']
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist

      # Without recommends, so a dependency missing from the package fails here.
      - name: Install
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./dist/*.deb

      - name: Check installed files
        run: |
          test -x /usr/bin/retropie-rom-manager
          test -f /usr/share/applications/retropie-rom-manager.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/retropie-rom-manager.svg
          test -n "$(ls /usr/share/retropie-rom-manager/assets/icons)"
          test -n "$(ls /usr/share/retropie-rom-manager/assets/systems)"
          missing=$(ldd /usr/bin/retropie-rom-manager | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "::error::Libraries the binary needs aren't installed:"
            echo "$missing"
            exit 1
          fi

      # Needs no display, so it shows the binary loads and runs.
      - name: Run --version
        run: |
          output=$(retropie-rom-manager --version)
          echo "$output"
          test "$output" = "retropie-rom-manager ${{ needs.version.outputs.version }}"

      - name: Remove
        run: |
          apt-get remove -y retropie-rom-manager
          test ! -e /usr/bin/retropie-rom-manager

  release:
    name: Draft release
    needs: [version, install]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: Write checksums and release notes
        run: |
          version=${{ needs.version.outputs.version }}
          (cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS)
          {
            # The top changelog entry's bullets, as a Markdown list.
            awk 'NR > 1 && /^ -- / { exit } NR > 2' packaging/changelog \
              | sed -e 's/^  \* /- /' -e 's/^    /  /'
            echo
            echo "## Install"
            echo
            echo "Download the package for your machine and install it with apt. It needs Debian 12, Ubuntu 22.04 or newer, or a distribution based on them."
            echo
            echo "| Machine | Command |"
            echo "|---|---|"
            echo "| 64-bit PC (amd64) | \`sudo apt install ./retropie-rom-manager_${version}-1_amd64.deb\` |"
            echo "| Raspberry Pi 4/5, Armbian and other 64-bit ARM (arm64) | \`sudo apt install ./retropie-rom-manager_${version}-1_arm64.deb\` |"
          } > notes.md
          cat notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.version.outputs.version }}
          gh release create "v$version" dist/*.deb dist/SHA256SUMS \
            --draft \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --notes-file notes.md
